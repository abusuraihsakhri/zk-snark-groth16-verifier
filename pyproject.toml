[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-snark-groth16-verifier"
version = "2.0.0"
description = "Educational modular-arithmetic proof-equation simulator and independent threshold audit"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
dev = ["pytest>=7.4,<10"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "zk_snark_verifier_app"]

[tool.setuptools.packages.find]
include = ["zk_snark_verifier*", "agents*"]

[project.scripts]
zk-snark-groth16-verifier = "zk_snark_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/zk-snark-groth16-verifier"
Repository = "https://github.com/abusuraihsakhri/zk-snark-groth16-verifier.git"
