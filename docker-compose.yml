version: '3.8'

services:
  zk-snark-groth16-verifier:
    build: .
    container_name: zk-snark-groth16-verifier
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=zk-snark-groth16-verifier-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
