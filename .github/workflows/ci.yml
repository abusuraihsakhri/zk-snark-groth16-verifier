name: Python tests and browser smoke

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"
      - name: Compile Python source
        run: python -m compileall -q agents zk_snark_verifier cli.py enrichment.py simulator.py
      - name: Python test suite
        run: python -m pytest -q
      - name: Browser JavaScript smoke
        run: node tests/web-smoke.cjs
      - name: Dependency metadata consistency
        run: python -m pip check
